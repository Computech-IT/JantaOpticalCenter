<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>My Account &amp; Prescriptions | Janta Optical Centre</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    .account-wrap { max-width: 1080px; margin: 40px auto; padding: 0 24px; }
    .auth-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 32px; }
    .panel-card { background: #fff; border: 1px solid var(--border-color); border-radius: 14px; padding: 28px; box-shadow: var(--shadow-sm); }
    .panel-card h2, .panel-card h3 { font-family: 'Playfair Display', serif; margin-bottom: 16px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    .field input, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; }
    .rx-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; margin-top: 24px; }
    .item-box { border: 1px solid #e2e8f0; border-radius: 10px; padding: 14px; margin-bottom: 12px; background: #f8fafc; }
    .hidden { display: none; }
    @media (max-width: 820px) { .dash-grid { grid-template-columns: 1fr; } }
  </style>
</head>

<body>
  <header class="navbar">
    <div class="navbar-content">
      <a href="/" class="logo" aria-label="Janta Optical Centre Home">
        <svg class="logo-svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="6" cy="15" r="4"/><circle cx="18" cy="15" r="4"/>
          <path d="M14 15a2 2 0 0 0-2-2 2 2 0 0 0-2 2"/><path d="M2.5 13 5 7c.7-1.3 1.4-2 3-2"/><path d="M21.5 13 19 7c-.7-1.3-1.5-2-3-2"/>
        </svg>
        <span class="logo-text">Janta Optical Centre</span>
      </a>
      <nav class="nav-links" aria-label="Primary Navigation">
        <a href="/">Shop</a>
        <a href="/account.html" style="color:var(--accent-hover);font-weight:600;">My Account</a>
        <a href="/about.html">About Us</a>
      </nav>
      <div class="nav-actions">
        <a href="/#collection" class="nav-cart-btn" aria-label="Shop">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        </a>
      </div>
    </div>
  </header>

  <main class="account-wrap">
    <section id="authView" class="auth-grid">
      <div class="panel-card">
        <h2>Customer Sign In</h2>
        <form id="customerLoginForm">
          <div class="field"><label for="loginEmail">Email</label><input type="email" id="loginEmail" required></div>
          <div class="field"><label for="loginPassword">Password</label><input type="password" id="loginPassword" required></div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
        </form>
      </div>

      <div class="panel-card">
        <h2>Create Account</h2>
        <form id="customerRegisterForm">
          <div class="field"><label for="regName">Full Name</label><input type="text" id="regName" required minlength="2"></div>
          <div class="field"><label for="regEmail">Email</label><input type="email" id="regEmail" required></div>
          <div class="field"><label for="regPhone">Phone</label><input type="tel" id="regPhone" placeholder="+91 98765 43210"></div>
          <div class="field"><label for="regPassword">Password (min 8 chars)</label><input type="password" id="regPassword" required minlength="8"></div>
          <button type="submit" class="btn btn-secondary" style="width:100%;">Create Account</button>
        </form>
      </div>
    </section>

    <section id="accountDashboard" class="hidden">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
        <div>
          <h1 style="font-family:'Playfair Display',serif;">Welcome, <span id="custName">Customer</span></h1>
          <p id="custEmail" style="color:var(--text-muted);font-size:14px;"></p>
        </div>
        <button type="button" id="custLogoutBtn" class="btn btn-secondary">Sign Out</button>
      </div>

      <div class="dash-grid">
        <div class="panel-card">
          <h3>Saved Eye Prescriptions</h3>
          <div id="rxList"></div>
          <hr style="margin:20px 0;border:none;border-top:1px solid #e2e8f0;">
          <h4 style="margin-bottom:12px;">Add New Prescription</h4>
          <form id="rxForm">
            <div class="field"><label for="rxLabel">Label</label><input type="text" id="rxLabel" placeholder="e.g. Reading / Everyday" required></div>
            <p style="font-size:12px;font-weight:600;margin-bottom:6px;">Right Eye (OD)</p>
            <div class="rx-grid">
              <div class="field"><input type="text" id="odSph" placeholder="SPH (e.g. -1.25)"></div>
              <div class="field"><input type="text" id="odCyl" placeholder="CYL (e.g. -0.50)"></div>
              <div class="field"><input type="text" id="odAxis" placeholder="AXIS (e.g. 90)"></div>
            </div>
            <p style="font-size:12px;font-weight:600;margin-bottom:6px;">Left Eye (OS)</p>
            <div class="rx-grid">
              <div class="field"><input type="text" id="osSph" placeholder="SPH (e.g. -1.50)"></div>
              <div class="field"><input type="text" id="osCyl" placeholder="CYL (e.g. -0.25)"></div>
              <div class="field"><input type="text" id="osAxis" placeholder="AXIS (e.g. 85)"></div>
            </div>
            <div class="field"><label for="rxPd">Pupillary Distance (PD mm)</label><input type="text" id="rxPd" placeholder="e.g. 62"></div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Save Prescription</button>
          </form>
        </div>

        <div class="panel-card">
          <h3>Order History</h3>
          <div id="ordersHistory"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <nav class="mobile-bottom-nav" aria-label="Mobile Navigation">
    <a href="/" class="mobile-nav-item"><div class="mobile-nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></div><div class="mobile-nav-label">Shop</div></a>
    <a href="/#collection" class="mobile-nav-item"><div class="mobile-nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></div><div class="mobile-nav-label">Browse</div></a>
    <a href="/account.html" class="mobile-nav-item active"><div class="mobile-nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div><div class="mobile-nav-label">Account</div></a>
    <a href="/about.html" class="mobile-nav-item"><div class="mobile-nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></div><div class="mobile-nav-label">About</div></a>
  </nav>

  <script src="/js/account.js"></script>
</body>

</html>
